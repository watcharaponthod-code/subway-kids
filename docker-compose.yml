version: "3.9"

services:

  # ── Next.js Web App ──────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws   # browser connects to host port
    depends_on:
      - server
    restart: unless-stopped

  # ── Python FastAPI + MediaPipe ───────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8000:8000"
    # ── Webcam passthrough (Linux only) ──
    # On Linux: device /dev/video0 is the default webcam
    # On Mac/Windows Docker Desktop: webcam passthrough is NOT supported natively.
    #   → Run the server locally instead:  cd server && python main.py
    devices:
      - /dev/video0:/dev/video0
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
